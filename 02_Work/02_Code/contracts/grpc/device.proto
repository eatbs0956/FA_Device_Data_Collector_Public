syntax = "proto3";
package daq;

import "google/protobuf/timestamp.proto";

// Unified DataPoint per LLD 12.2
message DataPoint {
  string tenant_id = 1;            // 租户/组织
  string tag_id = 2;               // 统一点位ID（替代 pointName）
  google.protobuf.Timestamp event_time = 3; // 事件时间
  int32 quality = 4;               // 质量码 0=OK
  string envelope_id = 5;          // 去重幂等
  string correlation_id = 6;       // 关联追踪
  int64 seq = 7;                   // 序号（设备侧递增）
  string source = 8;               // 来源 (adapter/topic/...)
  string headers_json = 9;         // 额外头部信息 JSON
  oneof value {                    // 统一值域
    double double_value = 10;
    string string_value = 11;
    int64 int_value = 12;
    bool bool_value = 13;
    bytes bytes_value = 14;
  }
  // 兼容字段（迁移期保留，后续删除）
  string device_id = 101 [deprecated = true];
  string point_name = 102 [deprecated = true];
  google.protobuf.Timestamp timestamp = 103 [deprecated = true];
}

message UploadAck {
  bool ok = 1;
  string message = 2;
}

service Ingestion {
  // 客户端流上传
  rpc Upload(stream DataPoint) returns (UploadAck);
}
