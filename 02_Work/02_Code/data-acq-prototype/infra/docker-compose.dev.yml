version: '3.8'
services:
  zookeeper:
    image: bitnami/zookeeper:3.8
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - 2181:2181

  kafka:
    image: bitnami/kafka:3.5
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_LISTENERS=PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    ports:
      - 9092:9092
    depends_on:
      - zookeeper

  postgres:
    image: timescale/timescaledb:latest-pg14
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=daq
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - 6379:6379

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    environment:
      - KC_DB=dev-mem
      - KC_HTTP_RELATIVE_PATH=/auth
    command: start-dev
    ports:
      - 8080:8080

  grafana:
    image: grafana/grafana:9.5
    ports:
      - 3000:3000

  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - 9090:9090

  ingestion:
    build:
      context: ../ingestion
      dockerfile: Dockerfile
    image: core-ingestion:dev
    depends_on:
      - kafka
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5001
    ports:
      - 5001:5001

  collector:
    build:
      context: ../collector
      dockerfile: Dockerfile
    image: core-collector:dev
    depends_on:
      - ingestion
    environment:
      - COLLECTOR_ENV=dev
    # Collector typically doesn't need ports exposed when running as agent; expose for debugging
    ports:
      - 6000:6000

volumes:
  pgdata:
