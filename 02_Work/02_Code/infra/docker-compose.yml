version: '3.9'
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
  postgres:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: postgres
  influxdb:
    image: influxdb:2
  redis:
    image: redis:7
  query-api:
    build: ../platform/center/Query.Api
  auth-api:
    build: ../platform/center/Auth.Api
  admin-api:
    build: ../platform/center/Admin.Api
    ports: ["18083:8080"]
  gateway-api:
    build: ../platform/center/Gateway.Api
    ports: ["18020:8080"]
    volumes:
      - ./logs/gateway:/app/logs
  monitor-api:
    build: ../platform/center/Monitor.Api
  processor-worker:
    build: ../platform/center/Processor.Worker
  scheduler-worker:
    build: ../platform/center/Scheduler.Worker
